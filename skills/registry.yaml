# Skills Registry — سجل المهارات القابلة لإعادة الاستخدام
# المهارة = إجراء معرفي/تقني موحّد يُستدعى من داخل وكيل، لا موظف مستقل.
# realization: كيف تتحقق المهارة فعلياً
#   prompt      = إجراء مكتوب يُحقن في سياق الوكيل (متاح الآن)
#   code        = دالة/سكربت في runtime/ (متاح الآن أو يحتاج برمجة حسب status)
#   claude_skill= مهارة Claude قائمة لدى المؤلف تُستدعى بالاسم
#   api         = يعتمد على واجهة خارجية
# status: available_now | needs_code | needs_api | needs_account
# ملاحظة: حقل used_by يُشتق آلياً من agents/_specs ويُتحقق منه في الاختبارات.

