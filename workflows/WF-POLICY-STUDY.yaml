workflow_id: WF-POLICY-STUDY
name_ar: دراسة سياسات
version: 0.1.0
project_types: [policy_study]
operating_model_min: B
citation_style: APA7
steps:
  - {id: S01, agent: AG-ORC, task: initialize_project, decision_level: L1}
  - {id: S02, agent: AG-RQA, task: define_policy_problem, reviewer: AG-CUL, gate: QG0, decision_level: L4, human_approval: true}
  - {id: S03, agent: AG-DSC, task: discover_sources_incl_official_docs, decision_level: L1}
  - {id: S04, agent: AG-SRC, task: verify_sources, decision_level: L1}
  - {id: S05, agent: AG-LRV, task: evidence_synthesis, reviewer: AG-SUP-EVD, gate: QG1, decision_level: L2}
  - {id: S06, agent: AG-DAT, task: indicator_analysis, reviewer: AG-SUP-MTH, optional_if: "not project.has_data", decision_level: L1}
  - {id: S07, agent: AG-POL, task: options_analysis, reviewer: AG-SUP-MTH, outputs: [policy_analysis.md], gate: QG2, decision_level: L2}
  - {id: S08, agent: AG-CUL, task: domain_review, decision_level: L1}
  - {id: S09, agent: AG-WRT, task: draft_policy_paper, reviewer: AG-SED, outputs: [policy_paper_draft.md], decision_level: L1}
  - {id: S10, agent: AG-EVA, task: audit_claims_and_citations, decision_level: L1}
  - {id: S11, agent: AG-RED, task: challenge_recommendations, gate: QG3, decision_level: L3}
  - {id: S12, agent: AG-SED, task: structural_edit, decision_level: L1}
  - {id: S13, agent: AG-INT, task: integrity_check, reviewer: AG-SUP-INT, gate: QG4, decision_level: L2}
  - {id: S14, agent: AG-ARE, task: language_and_terminology, reviewer: AG-SUP-EDT, gate: QG5, decision_level: L2}
  - {id: S15, agent: AG-ORC, task: request_final_approval, decision_level: L4, human_approval: true}
  - {id: S16, agent: AG-PUB, task: prepare_final_files, gate: QG6, decision_level: L4, human_approval: true}
  - {id: S17, uses: WF-PROJECT-CLOSE}
