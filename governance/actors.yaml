# الفاعلون غير الوكلاء: البشر والهيئات والمرسِلون الافتراضيون
version: 0.1.0
actors:
  - id: HUMAN-AUTHOR
    name_ar: المؤلف (صاحب القرار الفكري والنشر)
    kind: human
    decision_level: L4
    always_required: true
  - id: HUMAN-TECH
    name_ar: المشرف التقني (يمكن أن يكون المؤلف نفسه في Model A)
    kind: human
    role: صيانة البيئة والمفاتيح والموصلات والإصدارات التقنية
  - id: AG-COUNCIL
    name_ar: مجلس الوكلاء
    kind: body
    defined_in: governance/council.yaml
  - id: ALL
    name_ar: أي وكيل مفعّل في المشروع
    kind: wildcard
human_roles:
  # ما يحتاج موظفاً بشرياً (أو متعاقداً) لا وكيلاً
  - {role: المؤلف, model: [A, B, C], why: "السلطة الفكرية والاعتماد — غير قابلة للتفويض"}
  - {role: مدقق لغوي بشري للبروفة النهائية, model: [B, C], why: "مسؤولية الطباعة؛ الآلة تخفض الأخطاء ولا تضمن صفرها"}
  - {role: محكّمون بشريون خارجيون, model: [B, C], why: "التحكيم الأكاديمي المعتبر يتطلب أقراناً بشريين"}
  - {role: مصمم غلاف/جرافيك, model: [A, B, C], why: "الهوية البصرية والحقوق الإبداعية"}
  - {role: مستشار حقوق ونشر, model: [B, C], why: "عقود، أذونات، ISBN، الإيداع"}
  - {role: محقق تراثي, model: [C], why: "الترجيح بين القراءات ونسبة المخطوطات"}
  - {role: مهندس منصة (جزئي), model: [B, C], why: "تشغيل قواعد البيانات والمتجهات والأمن"}
