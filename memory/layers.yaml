# Memory Architecture — الطبقات الست + مخازن العمل
# المبدأ: Least Privilege. الصلاحيات الفعلية لكل وكيل في agents/<type>/<slug>/memory.yaml
# ولا تتحول معلومة إلى MEM-INSTITUTIONAL أو MEM-AUTHOR إلا بعد اعتمادها (approved_by).

version: 0.1.0

layers:
  - id: MEM-AUTHOR
    name_ar: ذاكرة المؤلف
    content: [الأسلوب والبصمة, المصطلحات المعتمدة, الاختيارات الفكرية المثبتة, المواقف المعتمدة (AUTHOR), الخطوط الحمراء]
    path: memory/author/
    classification: AUTHOR_ONLY
    write_policy: HUMAN-AUTHOR فقط (الوكلاء يقترحون عبر ST-KB-CANDIDATES)
    retention: دائمة
  - id: MEM-PROJECT
    name_ar: ذاكرة المشروع
    content: [قرارات المشروع DC-xxx, الأطروحة المعتمدة, النطاق, السياق التشغيلي]
    path: projects/<PID>/memory/
    classification: CONFIDENTIAL
    write_policy: AG-ORC, AG-DIR, AG-RQA (للنطاق) — بقيد في سجل القرارات
    retention: عمر المشروع ثم الأرشيف
  - id: MEM-RESEARCH
    name_ar: الذاكرة البحثية
    content: [المفاهيم, النظريات, ملخصات الدراسات, الخرائط المفاهيمية]
    path: knowledge-base/research/
    classification: INTERNAL
    write_policy: AG-KNW (بعد الاعتماد), القراءة واسعة
    retention: دائمة مع مراجعة سنوية
  - id: MEM-SOURCE
    name_ar: ذاكرة المصادر
    content: [سجل المصادر وفق source.schema.json, حالات التحقق, ربط Zotero]
    path: knowledge-base/sources/sources.jsonl
    classification: INTERNAL
    write_policy: AG-SRC فقط
    retention: دائمة
  - id: MEM-EDITORIAL
    name_ar: الذاكرة التحريرية
    content: [قرارات التحرير السابقة, دليل الأسلوب, المسرد, سوابق الخلاف وحسمها]
    path: knowledge-base/editorial/
    classification: INTERNAL
    write_policy: AG-SED (قرارات تحرير), المسرد بموافقة المؤلف
    retention: دائمة
  - id: MEM-INSTITUTIONAL
    name_ar: الذاكرة المؤسسية
    content: [السياسات, الممارسات الفضلى, الدروس المستفادة المعتمدة, القوالب]
    path: knowledge-base/institutional/
    classification: INTERNAL
    write_policy: لا كتابة مباشرة لأي وكيل؛ الترقية من ST-KB-CANDIDATES بموافقة المؤلف
    retention: دائمة بإصدارات

stores:
  - {id: ST-MANIFEST, name_ar: بيان المشروع, path: "projects/<PID>/manifest.yaml", classification: CONFIDENTIAL}
  - {id: ST-STATE, name_ar: حالة المشروع, path: "projects/<PID>/state.yaml", classification: CONFIDENTIAL}
  - {id: ST-DECISIONS, name_ar: سجل القرارات, path: "projects/<PID>/decisions.yaml", classification: CONFIDENTIAL}
  - {id: ST-RESEARCH-NOTES, name_ar: ملاحظات البحث, path: "projects/<PID>/research/", classification: INTERNAL}
  - {id: ST-EVIDENCE, name_ar: سجل الأدلة (claims ledger), path: "projects/<PID>/evidence/claims.jsonl", classification: INTERNAL}
  - {id: ST-DATA, name_ar: البيانات, path: "projects/<PID>/data/", classification: CONFIDENTIAL}
  - {id: ST-OUTLINE, name_ar: الهيكل, path: "projects/<PID>/outline.yaml", classification: CONFIDENTIAL}
  - {id: ST-DRAFT, name_ar: المسودات, path: "projects/<PID>/manuscript/drafts/", classification: CONFIDENTIAL}
  - {id: ST-REVIEWS, name_ar: المراجعات والتحكيم, path: "projects/<PID>/reviews/", classification: CONFIDENTIAL}
  - {id: ST-EDITED, name_ar: النص المحرر, path: "projects/<PID>/manuscript/edited/", classification: CONFIDENTIAL}
  - {id: ST-APPROVED, name_ar: النص المعتمد, path: "projects/<PID>/manuscript/approved/", classification: CONFIDENTIAL, note: "لا يكتب فيه إلا AG-ORC بعد APPROVAL من المؤلف (نقل لا تحرير)"}
  - {id: ST-PUBLISH, name_ar: مخرجات النشر, path: "publishing/<PID>/", classification: INTERNAL}
  - {id: ST-ARCHIVE, name_ar: الأرشيف, path: "projects/<PID>/archive/", classification: CONFIDENTIAL}
  - {id: ST-AUDIT, name_ar: سجل التدقيق, path: "logs/audit.jsonl", classification: INTERNAL, note: "إلحاقي فقط"}
  - {id: ST-COST, name_ar: سجل الكلفة, path: "logs/cost_events.jsonl", classification: INTERNAL}
  - {id: ST-WATCH, name_ar: توصيات الرصد, path: "projects/<PID>/watch/", classification: INTERNAL}
  - {id: ST-KB-CANDIDATES, name_ar: مرشحات المعرفة بانتظار الاعتماد, path: "knowledge-base/candidates/", classification: INTERNAL}
  - {id: ST-IMPROVEMENT, name_ar: سجل تحسين الوكلاء, path: "logs/agent_improvement_log.jsonl", classification: INTERNAL, note: "كل الوكلاء يكتبون مقترحات فقط (C6)"}

# مسار ترقية المعرفة
promotion_pipeline:
  - "الوكيل يقترح عنصراً ← ST-KB-CANDIDATES (verified=false)"
  - "AG-KNW يكمل حقول Memory Schema ويتحقق من المصدر"
  - "المشرف المختص يراجع (L2)"
  - "المؤلف يعتمد (L4) ← approved_by يُملأ"
  - "rkpos memory promote ينقل العنصر إلى الطبقة الهدف ويرفع version"
