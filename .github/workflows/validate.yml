name: validate
on:
  push:
  pull_request:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Structure check (file tree)
        run: python scripts/check_structure.py
      - name: System integrity (schemas, cross-references, least privilege, generated files in sync)
        run: rkpos validate
      - name: Agent test suites (offline structural check)
        run: rkpos eval
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Secret & permissions scan
        run: python scripts/security_scan.py
      - name: Project manifests & states
        run: python scripts/validate_projects.py
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal Markdown links
        run: python scripts/check_links.py
