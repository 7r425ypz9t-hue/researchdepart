# مستويات الإنتاج — كم يكتب النظام، وكم يكتب المؤلف، ومتى يتدخل.
# في كل المستويات: الوكيل يقترح، والمنظومة تقيس، والمؤلف يقرّر (L4)؛ ولا نص يدخل المخطوط المعتمد إلا بإقراره.
version: 0.1.0
words_per_page_default: 250      # صفحة كتاب عربي قياس 17×24 تقريباً؛ يعدّلها المؤلف لكل مشروع
levels:

  scaffold:
    name_ar: الهيكل — المؤلف يكتب
    order: 1
    summary: "يبني النظام المخطط وبطاقة لكل وحدة (الفكرة، والحجج، والشواهد المطلوبة، والأسئلة المفتوحة)، ويكتب المؤلف النص بنفسه، ثم يفحصه النظام."
    system_writes: unit_cards
    author_writes: full_text
    sequence: free
    steps:
      - "اقتراح المخطط واعتماده (L4)"
      - "بطاقة لكل وحدة"
      - "المؤلف يكتب الوحدة ويرفعها"
      - "فحص الوسوم والإحالات والبصمة"
      - "اعتماد الوحدة (L4)"

  staged:
    name_ar: التدرّجي — وحدة بعد وحدة
    order: 2
    summary: "يبدأ بالمقدمة، فلا تُكتب وحدة قبل أن يعتمد المؤلف التي قبلها؛ لكل وحدة مسودة فقياس فمراجعة المؤلف فاعتماد."
    system_writes: unit_drafts
    author_writes: revisions
    sequence: strict                 # الوحدة n تتطلب اعتماد الوحدة n-1
    steps:
      - "اقتراح المخطط واعتماده (L4)"
      - "مسودة المقدمة ← مراجعة المؤلف ← اعتماد"
      - "المحور التالي يُكتب على أساس ما اعتُمد قبله"
      - "قياس الصوت لكل وحدة ومواءمة عند الحاجة"
      - "تجميع الكتاب بعد اعتماد آخر وحدة"

  full:
    name_ar: الكامل — الكتاب دفعة واحدة
    order: 3
    summary: "يكتب النظام الكتاب كاملاً بعدد الصفحات المطلوب، وحدة بعد وحدة في تشغيل واحد، ثم يجمّعه ويقيس صوت كل وحدة؛ يراجع المؤلف ويغيّر ما يشاء، ويعيد النص إلى أسلوبه البشري الخالص قبل الاعتماد."
    system_writes: complete_book
    author_writes: revisions_and_final_voice
    sequence: drafted                # الوحدة n تتطلب وجود مسودة الوحدة n-1 (للاتساق)
    steps:
      - "تحديد عدد الصفحات ← الموازنة على الوحدات"
      - "اقتراح المخطط واعتماده (L4)"
      - "تقدير الكلفة وإقرارها قبل التشغيل"
      - "كتابة الوحدات كلها تباعاً ثم التجميع"
      - "تقرير الصوت: الوحدات الأقرب إلى الصياغة المُعانة أولاً"
      - "مراجعة المؤلف وتعديله، ومواءمة الصوت عند الحاجة"
      - "اعتماد كل وحدة (L4) ثم الكتاب"
