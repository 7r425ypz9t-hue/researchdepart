# جودة المخرج النهائي — التنقية واللغة البشرية المحكمة (مهارتا SKL-CLEANOUT وSKL-HUMANLANG)
# يُطبَّق على كل نص يُعرض على المؤلف أو يُصدَّر (الشاشة الجانبية، وقارئ العمل، وملف Word، والنص المعتمد).
# الأصل المحفوظ (Markdown) يبقى بوسومه المعيارية لأن أدوات الفحص تقرؤها؛ والتنقية طبقة عرض وتصدير.
version: 1.0.0

# ------------------------------------------------------------------ الوسوم والملاحظات الإنجليزية ← ترجمتها العربية بين قوسين
# reading: نسخة القراءة (تُحذف وسوم التصنيف وتبقى مواضع النقص والقرار)؛ tagged: نسخة المراجعة (كل الوسوم بالعربية)
notes:
  FACT:            {ar: "واقعة", reading: drop}
  EBI:             {ar: "استنتاج من الدليل", reading: drop}
  INTERP:          {ar: "تفسير", reading: drop}
  HYP:             {ar: "فرضية", reading: drop}
  AUTHOR:          {ar: "قرار المؤلف", reading: keep}
  NEEDS-EVIDENCE:  {ar: "يحتاج توثيقاً", reading: keep}
  CITATION-NEEDED: {ar: "يحتاج إحالة", reading: keep}
  TODO:            {ar: "للإكمال", reading: keep}
  TBD:             {ar: "يُحدَّد لاحقاً", reading: keep}
  NOTE:            {ar: "ملاحظة", reading: keep}
  CHECK:           {ar: "للتحقق", reading: keep}
  VERIFY:          {ar: "للتحقق", reading: keep}
  SOURCE:          {ar: "مصدر", reading: drop}
# عبارات إنجليزية شائعة داخل الملاحظات تُترجم آلياً؛ وما سواها من نص إنجليزي حر يُحذف من نسخة القراءة ويُذكر في تقرير التنقية
phrases:
  "pending approval": "بانتظار الاعتماد"
  "awaiting approval": "بانتظار الاعتماد"
  "author decision": "قرار المؤلف"
  "source needed": "يحتاج مصدراً"
  "citation needed": "يحتاج إحالة"
  "needs evidence": "يحتاج توثيقاً"
  "to be verified": "للتحقق"
  "to be confirmed": "للتأكيد"
  "not verified": "غير متحقق"
  "unverified": "غير متحقق"
  "see notes": "انظر الملاحظات"
section_labels:      # عناوين أقسام يكتبها الوكيل بالإنجليزية
  "NOTES": "ملاحظات الوكيل"
  "NOTE": "ملاحظة"
  "SOURCES": "المصادر"
  "REFERENCES": "المراجع"
  "SUMMARY": "الخلاصة"
  "CHANGES": "التعديلات"
  "QUESTIONS": "أسئلة للمؤلف"

# ------------------------------------------------------------------ العلامات المائية
watermarks:
  # مخفية: محارف غير مرئية تُحذف (عرض صفري، وتحكم اتجاه، ومحارف الوسوم، ومحددات التنويع، والواصلة اللينة)
  invisible_ranges: [[0x200B, 0x200F], [0x202A, 0x202E], [0x2060, 0x206F], [0xFEFF, 0xFEFF], [0x00AD, 0x00AD],
                     [0xFE00, 0xFE0F], [0xE0000, 0xE007F], [0x180E, 0x180E], [0x034F, 0x034F], [0x061C, 0x061C]]
  # مسافات غير اعتيادية تُوحَّد إلى مسافة عادية
  odd_spaces: [0x00A0, 0x2000, 0x2001, 0x2002, 0x2003, 0x2004, 0x2005, 0x2006, 0x2007, 0x2008, 0x2009, 0x200A, 0x202F, 0x205F, 0x3000]
  # ظاهرة: علامات تشغيل ومعرّفات داخلية تُحذف من نسخة القراءة
  visible_patterns:
    - "===BEGIN_TEXT===|===END_TEXT==="
    - "\\[@SRC-[^\\]]*\\]"
    - "\\bSRC-\\d+\\b"
    - "(?m)^\\s*(?:Generated|Written|Drafted) (?:by|with) [^\\n]*$"
    - "(?im)^\\s*(?:as an ai|i am an ai)[^\\n]*$"
  # خصائص ملف Word: تُمحى بصمة المكتبة («generated by python-docx») ويُثبَّت اسم المؤلف
  docx_properties: {author: from_manifest, comments: "", keywords: "", subject: "", category: "", last_modified_by: from_manifest}

# ------------------------------------------------------------------ الإخراج في المستندات
typography:
  brackets_color: "#FF0000"     # الأقواس وما بينها بالأحمر في كل مستند (Word، وقارئ العمل، والشاشة الجانبية)
  footnote_separator: 0.5       # الخط الفاصل بين المتن والحاشية: نصف عرض النص، من جهة اليمين
  footnotes: true               # الاستشهادات ([@SRC-…] و(المؤلف، السنة)) حواشٍ مرقّمة أسفل كل صفحة

# ------------------------------------------------------------------ اللغة البشرية المحكمة (لكل الأجناس)
human_language:
  rules:
    - "اكتب بعربية بشرية محكمة: جملة تؤدي معنى، لا قوالب جاهزة ولا لوازم لفظية متكررة."
    - "كل ملاحظة أو وسم أو تعليق داخل النص يُكتب بالعربية بين قوسين؛ لا إنجليزية إلا مصطلح علمي يُذكر بعد مقابله العربي بين قوسين."
    - "لا علامات تشغيل ولا معرّفات داخلية ولا محارف خفية في النص."
    - "الاستشهاد بمفتاح المصدر [@SRC-…] أو بصيغة (المؤلف، السنة، ص)؛ ويتحول آلياً إلى حاشية مرقّمة أسفل الصفحة، فلا تُكتب الحواشي يدوياً."
    - "لا شَرطة طويلة (—) لوصل الجمل؛ الوصل بالواو والفاء والفاصلة كما في الكتابة العربية."
    - "لا ثلاثيات متتالية ولا تعداد متناظر مصطنع، ولا افتتاح بعبارات العموم («في عالمنا اليوم»)، ولا ختام بعبارات التلخيص الجاهزة («في الختام»)."
  # لوازم الصياغة الآلية: تُعدّ لكل ألف كلمة، وما تجاوز الحد يُعلَّم ويُضبط آلياً
  checks:
    stock_phrases:
      max: 2
      patterns: ["في عالمنا المعاصر", "في عالمنا اليوم", "في عالم اليوم", "في ظل التحولات المتسارعة", "لا يخفى على أحد",
                 "تجدر الإشارة إلى", "ومن الجدير بالذكر", "من نافلة القول", "في الختام", "خلاصة القول", "وفي الختام",
                 "يلعب دوراً", "يلعب دورًا", "دوراً محورياً", "دورًا محوريًا", "حجر الزاوية", "حجر الأساس",
                 "تسليط الضوء", "يسلط الضوء", "بالغ الأهمية", "أهمية بالغة", "على حد سواء", "في هذا السياق",
                 "وفي هذا الإطار", "مشهد متغير", "آفاقاً جديدة", "آفاقًا جديدة", "غني عن البيان"]
    em_dash: {max: 3, chars: ["—"]}
    # ملاحظة إنجليزية حرة بين معقوفين بعد حذف اسم الوسم المعياري؛ أما المصطلح الأجنبي بين قوسين بعد مقابله العربي فمسموح
    latin_notes: {max: 0}
