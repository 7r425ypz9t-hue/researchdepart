# الانضباط الأكاديمي: يُحقن في برومبت الوكلاء للأجناس التي لا تُطبَّق فيها البصمة، ويُقاس به النص
discipline:
  rules:
    - "اكتب بلغة علمية محايدة دقيقة: جمل خبرية، ومصطلحات معرّفة، وفقرة لكل فكرة."
    - "لا إنشاء ولا زخرفة لفظية ولا تمهيد عاطفي، ولا تكرار للفكرة بعبارات مختلفة."
    - "لا حكايات ولا ذكريات ولا سرد ذاتي، ولا أمثلة توضيحية إلا ما كان دليلاً موثقاً لازماً للحجة."
    - "لا أسئلة بلاغية ولا تعجب ولا مبالغة ولا عبارات قطع («لا شك»، «مما لا ريب فيه»)."
    - "كل حكم مسند أو موسوم؛ وما لا دليل عليه يُعلَّم [NEEDS-EVIDENCE] ولا يُملأ بالإنشاء."
  checks:    # مؤشرات القياس لكل ألف كلمة، والحد الذي يُعلَّم بعده النص
    narrative: {max: 0, patterns: ["كنا صغار", "ذات يوم", "في طفولتي", "أذكر أن", "أتذكر", "يُحكى أن", "حكاية"]}
    examples: {max: 3, patterns: ["على سبيل المثال", "مثلاً", "مثال ذلك", "كمثال", "خذ مثلاً"]}
    first_person: {max: 2, patterns: ["أنا ", "كنتُ", "عشتُ", "رأيتُ", "أرى أن", "أظن"]}
    emphatic: {max: 1, patterns: ["لا شك", "مما لا ريب", "بلا ريب", "حقاً", "قطعاً"]}
    exclamation: {max: 0, chars: ["!"]}
    rhetorical_q: {max: 2, chars: ["؟"]}

