# الطيار الآلي — أسئلة المؤلف وخياراتها السريعة المعدّة مسبقاً.
# يمضي الوكلاء آلياً في كل خطوة لا تحتاج قرار المؤلف؛ ويتوقف الطيار عند السؤال، ويعرض خيارات جاهزة.
# النقر على خيار هو قرار المؤلف نفسه (L4) ويُسجَّل باسمه في decisions.yaml مع نص الخيار والملاحظة.
# action: اسم الإجراء في runtime/rkpos/autopilot.py — لا تغيّره؛ label وhint قابلان للتحرير.
version: 0.2.0
# طريقة العمل: «مباشر» (الافتراضي) يكتب الوكلاء المسودة كاملة دون توقف، ويعرضونها عليكم مرة واحدة للاعتماد؛
# «موجَّه» يتوقف عند كل قرار مرحلي (الإشكالية، المخطط، كل وحدة…).
default_mode: direct
modes:
  direct:
    name_ar: "مباشر — مسودة كاملة ثم مراجعتي"
    summary: "تُعتمد المراحل الوسيطة تفويضاً، وتُتخطى الخطوات التي لا تغيّر النص أو تحتاج أدوات غير متاحة؛ يُضبط النص آلياً، ثم سؤال واحد للاعتماد النهائي."
    # خطوات تُتخطى: بحث وتحقق يحتاجان أدوات غير متاحة للوكيل، ومراجعات تُنتج تقارير لا تدخل النص، وإجراءات الإغلاق
    skip_tasks: [discover_sources, discover_sources_incl_official_docs, horizon_scanning_sources, execute_registered_search,
                 verify_sources, verify_and_deduplicate, register_witnesses, re_verify_all_references_and_retractions,
                 update_literature_since_publication, synthesize_literature, thematic_synthesis, evidence_synthesis,
                 structured_literature_review, map_intellectual_traditions, what_changed_since_report,
                 screen_title_abstract_dual, screen_full_text_and_extract, idea_assessment_council, challenge_arguments, challenge_recommendations,
                 challenge_scenarios_plausibility, whole_book_challenge, cross_chapter_consistency, blind_review,
                 external_human_peer_review, revise_per_reviews, revise_per_external_review, structural_edit,
                 language_and_terminology, language_and_voice_alignment, edit_and_language, editorial_readiness,
                 convene_council_final, selection_bias_challenge, produce_figures, infographics,
                 tag_and_backup_all_versions, archive_project_with_checksums, extract_knowledge, archive_gate,
                 request_kb_promotion_approval, promote_approved_items_and_reindex, evaluate_temporary_agents, archive_and_index]
    # أول خطوة اعتماد نهائي يُطرح عندها السؤال الوحيد؛ وما بعدها يُغلق ضمن اعتمادكم
    final_tasks: [request_author_approval, request_final_approval, format_to_journal_guidelines, prepare_final_files,
                  prepare_new_edition_files, tag_release_v1_0]
  guided:
    name_ar: "موجَّه — أعتمد كل مرحلة"
    summary: "يتوقف عند كل قرار من مستوى L4 وعند اعتماد المخطط وكل وحدة."
questions:
  final_review:
    title: "المسودة كاملة: «{title}»"
    prompt: "كتب الوكلاء العمل كاملاً وضبطوه؛ اقرؤوه في الشاشة الجانبية أو نزّلوه، ثم قرروا."
    choices:
      - {id: approve, label: "اعتمد النص النهائي", action: approve_final, style: gold}
      - {id: polish, label: "اضبطه كله مرة أخرى ثم اعرضه", action: polish_all}
      - {id: redraft, label: "أعد كتابة المسودة بتوجيهي", action: redraft_all, needs_note: true}
      - {id: review, label: "سأراجع وأعدّل بنفسي", action: pause}
  step_approval:
    title: "اعتماد «{task}»"
    prompt: "أنجز الوكيل هذه الخطوة وتحتاج قراركم قبل المتابعة."
    choices:
      - {id: approve, label: "اعتمد وتابع", action: approve_step, style: gold}
      - {id: approve_note, label: "اعتمد مع ملاحظة", action: approve_step, needs_note: true}
      - {id: redo, label: "أعد التنفيذ بتوجيهي", action: redo_step, needs_note: true}
      - {id: pause, label: "أوقف لأراجع بنفسي", action: pause}
  outline_approval:
    title: "اعتماد مخطط العمل"
    prompt: "اقترح الوكيل مخطط الوحدات وموازنة الطول؛ لا تُكتب الوحدات قبل اعتماده."
    choices:
      - {id: approve, label: "اعتمد المخطط وتابع", action: approve_outline, style: gold}
      - {id: repropose, label: "اقترح مخططاً آخر بتوجيهي", action: repropose_outline, needs_note: true}
      - {id: edit, label: "سأحرّر المخطط بنفسي", action: pause}
  unit_approval:
    title: "اعتماد الوحدة «{unit}»"
    prompt: "كُتبت الوحدة وقيس صوتها؛ في المستوى التدرّجي لا تُكتب التالية قبل اعتمادها."
    choices:
      - {id: approve, label: "اعتمدها كما هي", action: approve_unit, style: gold}
      - {id: align_approve, label: "اضبط صياغتها ثم اعتمدها", action: align_then_approve}
      - {id: redraft, label: "أعد كتابتها بتوجيهي", action: redraft_unit, needs_note: true}
      - {id: review, label: "سأراجعها بنفسي", action: pause}
  book_review:
    title: "المسودة الكاملة جاهزة للمراجعة"
    prompt: "كُتبت الوحدات كلها وجُمّع العمل؛ الوحدات التي تحتاج ضبطاً معلَّمة في تقرير القياس."
    choices:
      - {id: review, label: "سأراجع الوحدات بنفسي", action: pause, style: gold}
      - {id: align_flagged, label: "اضبط الوحدات المعلَّمة آلياً ثم اسألني", action: align_flagged}
      - {id: approve_all, label: "اعتمد الوحدات كلها كما هي", action: approve_all_units}
  scaffold_write:
    title: "الدور لقلمكم: الوحدة «{unit}»"
    prompt: "مستوى الهيكل: أعدّ النظام بطاقات الوحدات، وتكتبون النص بأنفسكم ثم تعتمدونه."
    choices:
      - {id: write, label: "سأكتبها الآن", action: pause, style: gold}
  budget:
    title: "بلغت الكلفة ميزانية المشروع"
    prompt: "توقّف الطيار الآلي حمايةً للميزانية."
    choices:
      - {id: continue, label: "تابع رغم ذلك", action: continue_budget}
      - {id: pause, label: "أوقف", action: pause, style: gold}
  interrupted:
    title: "أوقفتم «{task}» أثناء الكتابة"
    prompt: "النص الجزئي محفوظ في الشاشة الجانبية. وجّهوا المسار ثم استأنفوا."
    choices:
      - {id: redo_note, label: "أعد الخطوة بتوجيهي", action: redo_step, needs_note: true, style: gold}
      - {id: redo, label: "أعد الخطوة كما هي", action: redo_step}
      - {id: skip, label: "تخطَّ هذه الخطوة", action: skip_step}
      - {id: pause, label: "أوقف", action: pause}
  error:
    title: "تعذّرت الخطوة «{task}»"
    prompt: "توقّف الطيار الآلي عند خطأ."
    choices:
      - {id: retry, label: "أعد المحاولة", action: retry, style: gold}
      - {id: skip, label: "تخطَّ هذه الخطوة", action: skip_step}
      - {id: pause, label: "أوقف", action: pause}
# المهام التي يتولاها محرّك بناء العمل بدل التشغيل العام
outline_tasks: [build_structure, build_argument_arc, propose_plot_outline, report_structure_exec_summary_first]
draft_tasks: [draft_chapter, draft_units_per_production_level, draft_op_ed, draft_study, draft_policy_paper, draft_review]
